server {
    listen 80;
    listen [::]:80;
    server_name byucalendar.com www.byucalendar.com;

    # Let's Encrypt renewals keep using HTTP-01; everything else redirects.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name byucalendar.com www.byucalendar.com;

    ssl_certificate /etc/letsencrypt/live/byucalendar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byucalendar.com/privkey.pem;

    # Compress worker responses; the events API JSON is ~1 MB uncompressed.
    # gzip_proxied any is required because every request arrives via Cloudflare.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css text/plain application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
