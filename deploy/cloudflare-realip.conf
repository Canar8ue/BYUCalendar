# Trust Cloudflare's CF-Connecting-IP only when the connection itself arrives
# from a Cloudflare range, so $remote_addr (access logs, X-Real-IP, and every
# app-side rate-limit key) becomes the true client address. Direct-to-origin
# clients cannot spoof this: their socket address is not a Cloudflare IP, so
# nginx keeps their real address.
#
# Install (root, once):
#   sudo cp deploy/cloudflare-realip.conf /etc/nginx/conf.d/cloudflare-realip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The sibling sites on this box are DNS-only (not proxied), so their traffic
# never comes from these ranges and keeps its true socket address — unaffected.
#
# Refresh this file when Cloudflare publishes new ranges (September 24, 2026 set):
#   curl -s https://www.cloudflare.com/ips-v4
#   curl -s https://www.cloudflare.com/ips-v6

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
